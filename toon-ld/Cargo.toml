[package]
name = "toon-ld"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Token-Oriented Object Notation for Linked Data - A compact RDF serialization format"
readme = "README.md"
keywords = ["toon", "json-ld", "rdf", "linked-data", "serialization"]
categories = ["encoding", "parser-implementations", "wasm"]

[dependencies]
toon-core = { path = "../toon-core", version = "0.2.1" }

# Re-export all dependencies that are part of the public API
serde = "1.0"
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
